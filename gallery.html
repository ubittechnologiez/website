<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — UBIT TECHNOLOGIEZ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/user_logo.png">
  <style>
    .gallery-page {
      padding: 80px 0 50px;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-title {
      font-family: 'Outfit', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      color: #000;
      margin-bottom: 20px;
      letter-spacing: -2px;
      text-align: center;
    }

    .gallery-divider {
      width: 60%;
      height: 1px;
      background: #e5e7eb;
      margin: 0 auto 25px;
    }

    .gallery-subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      color: #374151;
      max-width: 800px;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 1400px;
      padding: 0 20px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f3f4f6;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    @media (max-width: 1024px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .gallery-title { font-size: 4rem; }
    }

    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .gallery-title { font-size: 3rem; }
      .gallery-subtitle { font-size: 1.1rem; }
    }

    /* Navbar override for white page */
    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      border-bottom: 1px solid #f3f4f6;
    }
    .nav-links a { color: #0d1f3c !important; }
    .nav-logo-text .blue { color: #0d1f3c !important; }
  </style>
</head>
<body class="page-ready">

  <!-- ========== NAVIGATION ========== -->
  <nav class="navbar scrolled" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <img src="images/user_logo.png" alt="UBIT Technologiez Logo">
        <span class="nav-logo-text"><span class="blue">UBIT</span> <span class="gold">TECHNOLOGIEZ</span></span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#brands">Brands</a></li>
        <li><a href="index.html#why-us">Why Us</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="index.html#contact">Get Quote</a></li>
        <li><a href="portal.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <main class="gallery-page">
    <h1 class="gallery-title">gallery.</h1>
    <div class="gallery-divider"></div>
    <p class="gallery-subtitle">
      We design People Inspired Experiences that create positive change in people's lives.
    </p>

    <div class="gallery-grid" id="galleryGrid">
      <!-- Dynamic Content -->
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 UBIT Technologiez. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Firebase & Data -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="ticket-db.js"></script>
  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAcbM2yNNKtIfIArMBIeEAdtSiBYZ5Di6U",
      authDomain: "ubit-8ee71.firebaseapp.com",
      projectId: "ubit-8ee71",
      storageBucket: "ubit-8ee71.firebasestorage.app",
      messagingSenderId: "175386061057",
      appId: "1:175386061057:web:aec169054de22bc7bd9300",
      measurementId: "G-ZHE6JLKJ3C"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    DB.init((type) => {
      if (type === 'gallery' || type === 'gallerySettings') renderGallery();
    });

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const titleEl = document.querySelector('.gallery-title');
      const subEl = document.querySelector('.gallery-subtitle');
      
      const images = DB.getGallery();
      const settings = DB.getGallerySettings();
      
      if (settings.title) titleEl.textContent = settings.title;
      if (settings.subtitle) subEl.textContent = settings.subtitle;
      
      grid.innerHTML = images.map(img => `
        <div class="gallery-item">
          <img src="${img.url}" alt="${img.title || 'Gallery Image'}">
        </div>
      `).join('');
    }
  </script>

</body>
</html>
