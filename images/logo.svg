<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <!-- Metallic blue gradient for the stripes -->
    <linearGradient id="metalBlue1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1f3c"/>
      <stop offset="25%" style="stop-color:#2a5998"/>
      <stop offset="50%" style="stop-color:#5b8cc9"/>
      <stop offset="75%" style="stop-color:#2a5998"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <linearGradient id="metalBlue2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14305a"/>
      <stop offset="30%" style="stop-color:#3b72b5"/>
      <stop offset="55%" style="stop-color:#6a9fd6"/>
      <stop offset="80%" style="stop-color:#3b72b5"/>
      <stop offset="100%" style="stop-color:#14305a"/>
    </linearGradient>
    <linearGradient id="metalBlue3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3d6b"/>
      <stop offset="35%" style="stop-color:#4a85c2"/>
      <stop offset="60%" style="stop-color:#7ab3e3"/>
      <stop offset="85%" style="stop-color:#4a85c2"/>
      <stop offset="100%" style="stop-color:#1a3d6b"/>
    </linearGradient>
    <!-- Overall metallic sheen -->
    <linearGradient id="sheen" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#6aa3d9;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <g transform="translate(120, 0)">
    <!-- ====== LEFT SIDE STRIPES ====== -->
    <!-- Left outer stripe (leftmost) -->
    <path d="M -62 20 L -62 130 Q -62 190 0 190 Q 62 190 62 130 L 62 120" 
          fill="none" stroke="url(#metalBlue1)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="0 280 220" stroke-dashoffset="0"/>
    
    <!-- Actually, let me draw the stripes as filled paths for better control -->
  </g>

  <!-- Reset and draw properly -->
  <g transform="translate(0,0)">
    <!-- 
      The logo consists of parallel vertical bars that curve into a U shape.
      Left side: 3 bars going up-left, curving down into U
      Right side: 3 bars going up-right, curving down into U
      The bars merge/interleave at the U bottom
    -->
    
    <!-- ===== LEFT PRONG - Outermost stripe ===== -->
    <path d="M 52 15 L 52 140 Q 52 200 120 200 Q 188 200 188 140 L 188 15" 
          fill="none" stroke="url(#metalBlue1)" stroke-width="9" stroke-linecap="butt" opacity="0.95"/>
    
    <!-- Left Prong - Middle stripe -->
    <path d="M 68 25 L 68 135 Q 68 185 120 185 Q 172 185 172 135 L 172 25" 
          fill="none" stroke="url(#metalBlue2)" stroke-width="9" stroke-linecap="butt"/>
    
    <!-- Left Prong - Inner stripe -->
    <path d="M 84 35 L 84 130 Q 84 170 120 170 Q 156 170 156 130 L 156 35" 
          fill="none" stroke="url(#metalBlue3)" stroke-width="9" stroke-linecap="butt"/>

    <!-- Center inner detail - small bars -->
    <path d="M 100 50 L 100 120 Q 100 150 120 150 Q 140 150 140 120 L 140 50" 
          fill="none" stroke="url(#metalBlue2)" stroke-width="8" stroke-linecap="butt" opacity="0.9"/>

    <!-- Top fork split - Left side vertical extensions -->
    <!-- Left outer top -->
    <line x1="52" y1="15" x2="52" y2="80" stroke="url(#metalBlue1)" stroke-width="9" stroke-linecap="butt" opacity="0"/>
    
    <!-- Top Detail: The prongs at top split outward -->
    <!-- Left group top extensions (going slightly outward) -->
    <path d="M 52 15 L 44 0" fill="none" stroke="url(#metalBlue1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 68 25 L 63 5" fill="none" stroke="url(#metalBlue2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 84 35 L 82 15" fill="none" stroke="url(#metalBlue3)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Right group top extensions (going slightly outward) -->
    <path d="M 188 15 L 196 0" fill="none" stroke="url(#metalBlue1)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 172 25 L 177 5" fill="none" stroke="url(#metalBlue2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 156 35 L 158 15" fill="none" stroke="url(#metalBlue3)" stroke-width="8" stroke-linecap="round"/>

    <!-- Center top prongs -->
    <path d="M 100 50 L 100 25" fill="none" stroke="url(#metalBlue2)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 140 50 L 140 25" fill="none" stroke="url(#metalBlue2)" stroke-width="7" stroke-linecap="round"/>

    <!-- Metallic sheen overlay -->
    <path d="M 52 15 L 52 140 Q 52 200 120 200 Q 188 200 188 140 L 188 15" 
          fill="none" stroke="url(#sheen)" stroke-width="140" stroke-linecap="butt" opacity="0.15"/>
  </g>

  <!-- UBIT Text -->
  <text x="120" y="248" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" font-size="40" fill="#0d1f3c" letter-spacing="4">UBIT</text>
</svg>
