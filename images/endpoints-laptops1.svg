<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#edf2f7"/>
  <!-- Laptop body -->
  <rect x="220" y="130" width="360" height="220" rx="12" fill="#2b6cb0"/>
  <rect x="240" y="150" width="320" height="180" rx="6" fill="#0d1f3c"/>
  <!-- Screen content lines -->
  <rect x="260" y="170" width="200" height="12" rx="4" fill="#5b8cc9" opacity="0.7"/>
  <rect x="260" y="192" width="140" height="8" rx="4" fill="#5b8cc9" opacity="0.4"/>
  <rect x="260" y="212" width="180" height="8" rx="4" fill="#5b8cc9" opacity="0.4"/>
  <rect x="260" y="232" width="100" height="8" rx="4" fill="#5b8cc9" opacity="0.4"/>
  <!-- Keyboard base -->
  <rect x="180" y="355" width="440" height="20" rx="6" fill="#16315c"/>
  <rect x="200" y="370" width="400" height="6" rx="3" fill="#0d1f3c"/>
  <!-- Trackpad -->
  <rect x="330" y="365" width="140" height="8" rx="4" fill="#1a4a8a"/>
  <!-- Gold accent -->
  <rect x="220" y="128" width="360" height="4" rx="2" fill="#c6923a"/>
  <!-- Label -->
  <text x="400" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#16315c">Endpoints &amp; Laptops</text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4a5568">Enterprise-grade business notebooks</text>
</svg>
